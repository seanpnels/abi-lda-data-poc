name: NYC OSM facility validation POC - Stage 2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          python -m pip install --upgrade pip
          python -m pip install 'shapely>=2,<3' 'pyproj>=3,<4'
      - name: Download current New York OSM extract
        run: |
          mkdir -p work output/stage2
          curl --fail --location --retry 3 --retry-delay 15 --connect-timeout 30 --output work/new-york.osm.pbf https://download.geofabrik.de/north-america/us/new-york-latest.osm.pbf
          test -s work/new-york.osm.pbf
          osmium fileinfo -e work/new-york.osm.pbf > output/stage2/source-info.txt
      - name: Extract candidate features with geometry dependencies
        run: |
          osmium tags-filter work/new-york.osm.pbf \
            nwr/amenity=school,kindergarten,childcare,place_of_worship,college,university \
            nwr/building=school,kindergarten,church,chapel,mosque,synagogue,temple,college,university \
            nwr/social_facility=drug_addiction,alcohol_addiction \
            nwr/healthcare=speciality \
            -o work/candidates.osm.pbf --overwrite
          osmium fileinfo -e work/candidates.osm.pbf > output/stage2/candidates-info.txt
      - name: Export candidate geometry as GeoJSON sequence
        run: |
          osmium export work/candidates.osm.pbf -f geojsonseq -o work/candidates.geojsonseq --overwrite
          test -s work/candidates.geojsonseq
      - name: Generate validation report
        run: python scripts/validate.py work/candidates.geojsonseq output/stage2
      - name: Upload Stage 2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ny-osm-stage2-validation
          path: output/stage2/
          retention-days: 14
